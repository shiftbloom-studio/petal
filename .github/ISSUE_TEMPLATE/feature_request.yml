name: Feature request
description: An option, an emote or badge provider, or anything else Petal should have.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What should Petal do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
      description: The stream setup or situation this is for. If ChatIS or another overlay has it, say so.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      description: Comment with your approach and wait to be assigned before you start, see CONTRIBUTING.md.
      options:
        - label: I'd like to work on this myself
